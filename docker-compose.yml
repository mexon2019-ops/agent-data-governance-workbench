services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: data_governance
      POSTGRES_USER: dg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dg_user -d data_governance"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dg_user:${POSTGRES_PASSWORD}@postgres:5432/data_governance
      MES_DB_PASSWORD: ${MES_DB_PASSWORD:-}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-}
      MYSQL_DB_PASSWORD: ${MYSQL_DB_PASSWORD:-}
      PG_DB_PASSWORD: ${PG_DB_PASSWORD:-}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  pgdata:
