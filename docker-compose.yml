services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: data_governance
      POSTGRES_USER: dg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dg_user -d data_governance"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  mysql-test:
    image: mysql:8.0
    profiles: ["mysql-test"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Set MYSQL_TEST_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mes_test
      MYSQL_TEST_READER_PASSWORD: ${MYSQL_TEST_READER_PASSWORD:?Set MYSQL_TEST_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysqltestdata:/var/lib/mysql
      - ./docker/mysql-test/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dg_user:${POSTGRES_PASSWORD}@postgres:5432/data_governance
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (at least 32 random characters)}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env (at least 16 characters)}
      MES_DB_PASSWORD: ${MES_DB_PASSWORD:-}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-}
      MYSQL_DB_PASSWORD: ${MYSQL_DB_PASSWORD:-}
      MYSQL_TEST_READER_PASSWORD: ${MYSQL_TEST_READER_PASSWORD:?Set MYSQL_TEST_READER_PASSWORD in .env}
      AUTO_REGISTER_MYSQL_TEST_DATASOURCE: "true"
      MYSQL_TEST_HOST: mysql-test
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DATABASE: mes_test
      MYSQL_TEST_USERNAME: metadata_reader
      PG_DB_PASSWORD: ${PG_DB_PASSWORD:-}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  pgdata:
  mysqltestdata:
