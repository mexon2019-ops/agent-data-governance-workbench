name: Runtime smoke test and screenshots
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-and-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install fastapi==0.115.12 uvicorn==0.34.2 SQLAlchemy==2.0.40 alembic==1.15.2 pytest
      - name: Run metadata ingestion unit tests
        run: |
          cd backend
          DATABASE_URL=sqlite:////tmp/metadata-unit-ci.db PYTHONPATH=. pytest -q
      - name: Apply database migrations
        run: |
          cd backend
          DATABASE_URL=sqlite:////tmp/governance-smoke.db PYTHONPATH=. alembic upgrade head
      - name: Start backend
        run: |
          cd backend
          nohup env AUTH_SECRET=ci-test-secret-with-32-characters-minimum-123456 BOOTSTRAP_ADMIN_PASSWORD=ci-bootstrap-password-123456 DATABASE_URL=sqlite:////tmp/governance-smoke.db uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
      - name: Install frontend and browser
        run: |
          cd frontend
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start frontend
        run: |
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 >/tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173 >/dev/null && break || sleep 2; done
      - name: Capture real browser screenshots and smoke-test pages
        run: |
          cd frontend
          mkdir -p ../artifacts
          cat > smoke.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:5173',{waitUntil:'networkidle'});
            const login=await page.request.post('http://127.0.0.1:8000/api/v1/auth/login',{data:{username:'admin',password:process.env.CI_ADMIN_PASSWORD}});
            const loginData=await login.json();
            if(login.status()!==200) throw new Error('CI login failed');
            await page.addInitScript(token=>sessionStorage.setItem('dg_token',token),loginData.access_token);
            await page.screenshot({path:'../artifacts/01-dashboard.png',fullPage:true});
            const labels=['数据源管理','数据资产','元数据目录','数据标准','数据质量','治理任务','Agent 助手'];
            for(let i=0;i<labels.length;i++){
              await page.getByRole('button',{name:new RegExp(labels[i])}).first().click();
              await page.waitForTimeout(350);
              await page.screenshot({path:'../artifacts/0'+(i+2)+'-'+['sources','assets','catalog','standards','quality','tasks','agent'][i]+'.png',fullPage:true});
            }
            await page.getByRole('button',{name:/数据源管理/}).first().click();
          await page.waitForTimeout(350);
          await page.getByRole('button',{name:/新增数据源/}).click();
            await page.screenshot({path:'../artifacts/09-source-create-modal.png',fullPage:true});
            const health=await page.request.get('http://127.0.0.1:8000/health');
            const dashboard=await page.request.get('http://127.0.0.1:8000/api/v1/dashboard');
            const metadata=await page.request.get('http://127.0.0.1:8000/api/v1/metadata/tables');
            const created=await page.request.post('http://127.0.0.1:8000/api/v1/datasources',{data:{name:'smoke-mysql',db_type:'mysql',host:'127.0.0.1',port:3306,database:'smoke',username:'readonly',password_env_key:'SMOKE_DB_PASSWORD',description:'CI smoke source'}});
            const sync=created.status()===201?await page.request.post('http://127.0.0.1:8000/api/v1/datasources/1/sync'):null;
            const runs=await page.request.get('http://127.0.0.1:8000/api/v1/datasources/1/sync-runs');
            const results={health:health.status(),dashboard:dashboard.status(),metadata:metadata.status(),datasourceCreate:created.status(),sync:sync?.status(),syncExpectedFailure:sync?(await sync.json()).success===false:false,syncRuns:runs.status(),pageErrors:errors};
            require('fs').writeFileSync('../artifacts/smoke-results.json',JSON.stringify(results,null,2));
            await browser.close();
            if(health.status()!==200||dashboard.status()!==200||metadata.status()!==200||created.status()!==201||sync?.status()!==200||runs.status()!==200||results.syncExpectedFailure!==true||errors.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-real-browser-screenshots
          path: artifacts/
          retention-days: 14
